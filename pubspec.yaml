name: drama_play
description: AI-generated interactive drama game app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  in_app_purchase: ^3.2.0
  share_plus: ^10.0.0
  google_mobile_ads: ^5.1.0
  posthog_flutter: ^4.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Fonts served via google_fonts package — no bundled assets needed
